id: mosaic-engine
name: Mosaic engine (video walls)
category: video-wall
description: >
  The mosaic engine on the media server, which drives every video wall and
  display ("group"), and its sound outputs. Groups, presets, scenes, NDI
  streams and sound outputs are read live from the engine, so anything made
  in the mosaic editor shows up here by itself. The media server runs one
  canvas per area (Inside bar, Bar tower, ...): add one of these devices per
  canvas, with its canvas id (canvas-1, canvas-2, ... listed at
  http://media-server:8090/api/canvases; blank is the main one). Port 8090
  must be open on the media server. If an API key is set in the editor
  (Settings > Access), enter it here.

transport:
  type: http
  port: 8090
  minGapMs: 0

settings:
  - { key: host, label: Media server IP address, type: string, required: true }
  - { key: port, label: Port, type: integer, default: 8090 }
  - { key: canvas, label: Canvas, type: string, help: "canvas-1, canvas-2, ... (see http://media-server:8090/api/canvases). Blank: the main canvas" }
  - { key: apiKey, label: API key, type: string, help: "Only if one is set in the mosaic editor" }

commands:
  # Everything about the canvas in one request. The poll below uses the same
  # rules. Lists are kept whole (for the panel's buttons) and per group (for
  # "which preset is on").
  read_control:
    label: Read walls, presets and streams
    hidden: true
    steps: [{ http: { method: GET, path: "/api/control?canvas={{settings.canvas}}" } }]
    parse: &control
      - jsonPath: $.groups
        set: { groupList: "{{value}}" }
      - jsonPath: "$.groups[*]"
        set:
          "groups.{{value.id}}.name": "{{value.name}}"
          "groups.{{value.id}}.activePreset": "{{value.activePreset}}"
          "groups.{{value.id}}.presets": "{{value.presets}}"
          "groups.{{value.id}}.noSignal": "{{value.noSignal}}"
          "groups.{{value.id}}.showing": "{{value.showing}}"
          "groups.{{value.id}}.on": "{{value.on}}"
          "groups.{{value.id}}.arrangement": "{{value.arrangement}}"
          "groups.{{value.id}}.arrangements": "{{value.arrangements}}"
          "groups.{{value.id}}.slots": "{{value.slots}}"
      - jsonPath: $.scenes
        set: { sceneList: "{{value}}" }
      - jsonPath: $.layouts
        set: { layoutList: "{{value}}" }
      - jsonPath: $.layout.name
        set: { layout: "{{value}}" }
      - jsonPath: $.ndi.streams
        set: { streams: "{{value}}" }
      - jsonPath: $.endpoints
        set: { endpointList: "{{value}}" }
      - jsonPath: "$.endpoints[*]"
        set:
          "endpoints.{{value.id}}.online": "{{value.online}}"
          "endpoints.{{value.id}}.displaysOk": "{{value.displaysOk}}"
          "endpoints.{{value.id}}.displays": "{{value.displays}}"
      - jsonPath: $.playlists
        set: { playlists: "{{value}}" }
      - jsonPath: $.background
        set:
          "background.on": "{{value.on}}"
          "background.ndiName": "{{value.ndiName}}"
          "background.playlist": "{{value.playlist}}"
          "background.signal": "{{value.signal}}"

  recall_preset:
    label: Recall wall preset
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
      preset: { type: string, label: Preset, optionsFrom: "state.groups.{{group}}.presets" }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 500 }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/presets/{{preset}}/recall?canvas={{settings.canvas}}"
          body: '{"transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
    sets: { "groups.{{group}}.activePreset": "{{preset}}" }

  show_stream:
    label: Show a stream on a whole wall
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
      ndiName: { type: string, label: NDI stream, optionsFrom: state.streams }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 500 }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/show?canvas={{settings.canvas}}"
          body: '{"ndiName": {{ndiName | json}}, "transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
    sets: { "groups.{{group}}.activePreset": "", "groups.{{group}}.stream": "{{ndiName}}" }

  clear:
    label: Blank a wall
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 500 }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/clear?canvas={{settings.canvas}}"
          body: '{"transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
    sets: { "groups.{{group}}.activePreset": "", "groups.{{group}}.stream": "" }

  restart_videos:
    label: Restart a wall's videos together
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/restart?canvas={{settings.canvas}}"
          body: "{}"
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }

  # Split screens. An arrangement divides a wall into numbered slots; each slot
  # plays a stream or a playlist. These read the engine again right after the
  # change, so the panel shows the result at once.
  arrange:
    label: Split a wall (one, two, four, five, per panel)
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
      arrangement: { type: string, label: Arrangement, optionsFrom: "state.groups.{{group}}.arrangements" }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 500 }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/arrange?canvas={{settings.canvas}}"
          body: '{"arrangement": {{arrangement | json}}, "transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
      - { command: read_control }

  slot_stream:
    label: Put a stream in one slot of a wall
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
      slot: { type: integer, label: Slot, min: 1, max: 64, default: 1 }
      ndiName: { type: string, label: NDI stream, optionsFrom: state.streams }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 500 }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/slots/{{slot}}?canvas={{settings.canvas}}"
          body: '{"ndiName": {{ndiName | json}}, "transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
      - { command: read_control }

  slot_playlist:
    label: Put a playlist in one slot of a wall
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
      slot: { type: integer, label: Slot, min: 1, max: 64, default: 1 }
      playlist: { type: string, label: Playlist, optionsFrom: state.playlists }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 500 }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/slots/{{slot}}?canvas={{settings.canvas}}"
          body: '{"playlist": {{playlist | json}}, "transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
      - { command: read_control }

  slot_empty:
    label: Empty one slot of a wall
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
      slot: { type: integer, label: Slot, min: 1, max: 64, default: 1 }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 500 }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/slots/{{slot}}?canvas={{settings.canvas}}"
          body: '{"transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
      - { command: read_control }

  content:
    label: Wall content on or off
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
      "on": { type: boolean, label: "On", default: true }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 500 }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/content?canvas={{settings.canvas}}"
          body: '{"on": {{on}}, "transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
      - { command: read_control }

  save_preset:
    label: Save what a wall shows as a preset
    params:
      group: { type: string, label: Wall, optionsFrom: state.groupList }
      name: { type: string, label: "Preset name (the same name overwrites)" }
    steps:
      - http:
          method: POST
          path: "/api/walls/{{group}}/presets?canvas={{settings.canvas}}"
          body: '{"name": {{name | json}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
      - { command: read_control }

  # The background plays under every wall of the canvas.
  background_on:
    label: Background on or off
    params:
      "on": { type: boolean, label: "On", default: true }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 1000 }
    steps:
      - http:
          method: POST
          path: "/api/background?canvas={{settings.canvas}}"
          body: '{"on": {{on}}, "transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
      - { command: read_control }

  background_stream:
    label: Background plays a stream
    params:
      ndiName: { type: string, label: NDI stream, optionsFrom: state.streams }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 1000 }
    steps:
      - http:
          method: POST
          path: "/api/background?canvas={{settings.canvas}}"
          body: '{"on": true, "ndiName": {{ndiName | json}}, "transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
      - { command: read_control }

  background_playlist:
    label: Background plays a playlist
    params:
      playlist: { type: string, label: Playlist, optionsFrom: state.playlists }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 1000 }
    steps:
      - http:
          method: POST
          path: "/api/background?canvas={{settings.canvas}}"
          body: '{"on": true, "playlist": {{playlist | json}}, "transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
      - { command: read_control }

  # Setup help: every screen of a receiving PC shows its number for 10 minutes.
  identify_screens:
    label: Show screen numbers on a wall PC
    params:
      endpoint: { type: string, label: Wall PC, optionsFrom: state.endpointList }
      "on": { type: boolean, label: Showing, default: true }
    steps:
      - http:
          method: POST
          path: "/api/endpoints/{{endpoint}}/identify?canvas={{settings.canvas}}"
          body: '{"on": {{on}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }

  # Sound outputs. The engine takes the whole list back, so each change reads
  # the list fresh, changes one value of one output, and sends it all.
  read_audio:
    label: Read sound outputs
    hidden: true
    steps: [{ http: { method: GET, path: "/api/layout?canvas={{settings.canvas}}" } }]
    parse:
      - jsonPath: $.audioOutputs
        set: { audioOutputs: "{{value}}" }

  audio_volume:
    label: Sound output volume
    params:
      output: { type: string, label: Sound output, optionsFrom: state.audioOutputs }
      volumeDb: { type: number, label: Volume (dB), min: -60, max: 12, step: 1, default: 0 }
    steps:
      - { command: read_audio }
      - http:
          method: PUT
          path: "/api/layout?canvas={{settings.canvas}}"
          body: '{"audioOutputs": {{state.audioOutputs | patch:id:@output:volumeDb:@volumeDb | json}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
    sets: { "audio.{{output}}.volumeDb": "{{volumeDb}}" }

  audio_mute:
    label: Sound output mute
    params:
      output: { type: string, label: Sound output, optionsFrom: state.audioOutputs }
      mute: { type: boolean, label: Muted, default: true }
    steps:
      - { command: read_audio }
      - http:
          method: PUT
          path: "/api/layout?canvas={{settings.canvas}}"
          body: '{"audioOutputs": {{state.audioOutputs | patch:id:@output:mute:@mute | json}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
    sets: { "audio.{{output}}.mute": "{{mute}}" }

  audio_source:
    label: Sound output source
    params:
      output: { type: string, label: Sound output, optionsFrom: state.audioOutputs }
      source: { type: string, label: "Plays (NDI stream, or input:<device> for a sound input)", optionsFrom: state.streams }
    steps:
      - { command: read_audio }
      - http:
          method: PUT
          path: "/api/layout?canvas={{settings.canvas}}"
          body: '{"audioOutputs": {{state.audioOutputs | patch:id:@output:source:@source | json}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }
    sets: { "audio.{{output}}.source": "{{source}}" }

  recall_scene:
    label: Recall scene (all walls)
    params:
      scene: { type: string, label: Scene, optionsFrom: state.sceneList }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 1000 }
    steps:
      - http:
          method: POST
          path: "/api/scenes/{{scene}}/recall?canvas={{settings.canvas}}"
          body: '{"transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }

  activate_layout:
    label: Switch room layout
    params:
      layout: { type: string, label: Layout, optionsFrom: state.layoutList }
      transitionMs: { type: integer, label: Crossfade (ms), min: 0, max: 10000, default: 1000 }
    steps:
      - http:
          method: POST
          path: "/api/layouts/{{layout}}/activate?canvas={{settings.canvas}}"
          body: '{"transitionMs": {{transitionMs}}}'
          headers: { Content-Type: application/json, X-Api-Key: "{{settings.apiKey}}" }

state:
  layout: { type: string, label: Room layout }
  "groups.*.activePreset": { type: string, label: Preset on }
  "groups.*.name": { type: string, label: Wall name }
  "endpoints.*.online": { type: boolean, label: Wall PC online }
  "audio.*.volumeDb": { type: number, label: Volume (dB) }
  "audio.*.mute": { type: boolean, label: Muted }
  "audio.*.source": { type: string, label: Plays }
  "audio.*.problem": { type: string, label: Sound problem }
  "groups.*.on": { type: boolean, label: Content on }
  "groups.*.arrangement": { type: string, label: Split }
  "background.on": { type: boolean, label: Background on }
  "background.ndiName": { type: string, label: Background stream }
  "background.playlist": { type: string, label: Background playlist }
  "background.signal": { type: string, label: Background signal }
  "canvases.*.running": { type: boolean, label: Canvas running }
  "canvases.*.error": { type: string, label: Canvas problem }

# Read everything every few seconds (the rules are read_control's).
polls:
  - every: 3
    steps: [{ http: { method: GET, path: "/api/control?canvas={{settings.canvas}}" } }]
    parse: *control

  # Sound outputs: their settings from the layout, their health from /api/audio.
  - every: 5
    steps: [{ http: { method: GET, path: "/api/layout?canvas={{settings.canvas}}" } }]
    parse:
      - jsonPath: $.audioOutputs
        set: { audioOutputs: "{{value}}" }
      - jsonPath: "$.audioOutputs[*]"
        set:
          "audio.{{value.id}}.volumeDb": "{{value.volumeDb}}"
          "audio.{{value.id}}.mute": "{{value.mute}}"
          "audio.{{value.id}}.source": "{{value.source}}"
  - every: 5
    steps: [{ http: { method: GET, path: "/api/audio?canvas={{settings.canvas}}" } }]
    parse:
      - jsonPath: "$.outputs[*]"
        set: { "audio.{{value.id}}.problem": "{{value.error | default:@value.sourceError}}" }

  # Every canvas the media server runs, and whether each is running.
  - every: 15
    steps: [{ http: { method: GET, path: "/api/canvases" } }]
    parse:
      - jsonPath: $.canvases
        set: { canvasList: "{{value}}" }
      - jsonPath: "$.canvases[*]"
        set:
          "canvases.{{value.id}}.name": "{{value.name}}"
          "canvases.{{value.id}}.running": "{{value.running}}"
          "canvases.{{value.id}}.error": "{{value.error}}"

capabilities:
  layoutPresets: { recall: recall_preset, param: preset, optionsFrom: state.groupList }

controls:
  - type: group
    repeat: state.groupList
    label: "{{item.name}}"
    controls:
      - { type: presets, label: Presets, command: recall_preset, param: preset, params: { group: "{{item.id}}" }, options: item.presets, state: "groups.{{item.id}}.activePreset" }
      - { type: select, label: Show one stream, command: show_stream, param: ndiName, params: { group: "{{item.id}}" }, options: state.streams, state: "groups.{{item.id}}.stream" }
      # Split screens: pick how the wall is divided, then what each part plays.
      - { type: presets, label: Split, command: arrange, param: arrangement, params: { group: "{{item.id}}" }, options: item.arrangements, state: "groups.{{item.id}}.arrangement" }
      - type: group
        repeat: item.slots
        label: "{{item.name}}"
        controls:
          - { type: select, label: Stream, command: slot_stream, param: ndiName, params: { group: "{{parent.id}}", slot: "{{item.slot}}" }, options: state.streams, state: item.ndiName }
          - { type: select, label: Playlist, command: slot_playlist, param: playlist, params: { group: "{{parent.id}}", slot: "{{item.slot}}" }, options: state.playlists, state: item.playlist, when: state.playlists }
      - { type: toggle, label: Content, command: content, param: "on", params: { group: "{{item.id}}" }, state: "groups.{{item.id}}.on", when: item.arrangements }
      - { type: status, label: On screen, state: "groups.{{item.id}}.showing" }
      - { type: status, label: No signal from, state: "groups.{{item.id}}.noSignal" }
      - { type: button, label: Blank this wall, command: clear, params: { group: "{{item.id}}" } }
      - { type: button, label: Restart videos, command: restart_videos, params: { group: "{{item.id}}" } }
  - { type: presets, label: Scenes (all walls), command: recall_scene, param: scene, options: state.sceneList }
  - type: group
    label: Background (under every wall)
    when: background.signal
    controls:
      - { type: toggle, label: Background, command: background_on, param: "on", state: background.on }
      - { type: select, label: Stream, command: background_stream, param: ndiName, options: state.streams, state: background.ndiName }
      - { type: select, label: Playlist, command: background_playlist, param: playlist, options: state.playlists, state: background.playlist, when: state.playlists }
      - { type: status, label: Signal, state: background.signal }
  - type: group
    repeat: state.audioOutputs
    label: "{{item.name}} (sound)"
    controls:
      - { type: slider, label: Volume (dB), command: audio_volume, param: volumeDb, params: { output: "{{item.id}}" }, state: "audio.{{item.id}}.volumeDb" }
      - { type: toggle, label: Muted, command: audio_mute, param: mute, params: { output: "{{item.id}}" }, state: "audio.{{item.id}}.mute" }
      - { type: select, label: Plays, command: audio_source, param: source, params: { output: "{{item.id}}" }, options: state.streams, state: "audio.{{item.id}}.source" }
      - { type: status, label: Problem, state: "audio.{{item.id}}.problem" }

# Example content so the panel has something to show in simulation mode.
simulator:
  state:
    layout: Venue
    groupList:
      - id: main-wall
        name: Main wall
        activePreset: camera-1-full
        presets: [{ id: camera-1-full, name: Camera 1 full }, { id: camera-slides, name: Camera + slides }, { id: quad, name: Quad }]
        "on": true
        arrangement: two
        arrangements: [{ id: full, name: One stream, slots: 1 }, { id: two, name: Two side by side, slots: 2 }, { id: quad, name: Four, slots: 4 }]
        slots:
          - { slot: 1, name: Left, ndiName: "ZOWIEBOXPRO-54447 (ZowieBox-54447)", playlist: "", video: "", signal: ok }
          - { slot: 2, name: Right, ndiName: "", playlist: Game day, video: "", signal: ok }
      - id: double-wide
        name: Double wide
        activePreset: ""
        presets: [{ id: slides-full, name: Slides full }]
    "groups.main-wall.activePreset": camera-1-full
    "groups.main-wall.on": true
    "groups.main-wall.arrangement": two
    "groups.main-wall.arrangements": [{ id: full, name: One stream, slots: 1 }, { id: two, name: Two side by side, slots: 2 }, { id: quad, name: Four, slots: 4 }]
    playlists: [{ id: Game day, name: Game day, videos: 2 }]
    "background.on": false
    "background.ndiName": ""
    "background.playlist": Game day
    "background.signal": ok
    canvasList: [{ id: canvas-1, name: Inside bar, running: true }, { id: canvas-2, name: Bar tower, running: true }]
    "groups.main-wall.presets": [{ id: camera-1-full, name: Camera 1 full }, { id: camera-slides, name: Camera + slides }, { id: quad, name: Quad }]
    "groups.double-wide.activePreset": ""
    "groups.double-wide.presets": [{ id: slides-full, name: Slides full }]
    sceneList: [{ id: opening, name: Opening }]
    layoutList: [{ id: venue, name: Venue, active: true }]
    streams: ["ZOWIEBOXPRO-54447 (ZowieBox-54447)", "GFX-PC (Slides)"]
    audioOutputs:
      - { id: bar, name: Bar speakers, source: "ZOWIEBOXPRO-54447 (ZowieBox-54447)", device: "", channelPair: 0, volumeDb: -6, mute: false, matchWall: true, delayMs: 0, enabled: true }
      - { id: patio, name: Patio, source: "GFX-PC (Slides)", device: "", channelPair: 1, volumeDb: -12, mute: true, matchWall: true, delayMs: 0, enabled: true }
    "audio.bar.volumeDb": -6
    "audio.bar.mute": false
    "audio.bar.source": "ZOWIEBOXPRO-54447 (ZowieBox-54447)"
    "audio.patio.volumeDb": -12
    "audio.patio.mute": true
    "audio.patio.source": "GFX-PC (Slides)"
