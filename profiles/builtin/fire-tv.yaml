id: fire-tv
name: Fire TV
manufacturer: Amazon Fire TV (Fire TV Omni, Insignia, Toshiba, Hisense, Fire TV Stick and Cube)
model: Any Fire TV
category: display
description: >
  Network control over ADB, built into Blue Vue (no Android tools needed).
  On each Fire TV: Settings > My Fire TV (or Device & Software) > About,
  press the device name 7 times to show Developer options, then Developer
  options > ADB debugging: On. Give each TV a fixed IP address on your router.
  The first time Blue Vue connects, the TV asks "Allow debugging?": tick
  "Always allow from this computer" and press Allow. On and Off are discrete
  (wake and sleep keys), and the TV reports whether it's awake. HDMI keys
  work on Fire TV smart TVs with HDMI inputs; a Fire TV Stick or Cube has
  none, and turns the TV it's plugged into on and off over HDMI-CEC.

discover: adb

transport:
  type: adb
  port: 5555
  minGapMs: 150

settings:
  - { key: host, label: IP address, type: string, required: true }
  - { key: powerOnInput, label: Input when turned on, type: enum, values: [hdmi1, hdmi2, hdmi3, hdmi4], help: "Optional. The input this TV goes to when Blue Vue turns it on, until someone picks an input for it. After that it returns to the input it was last on. Blank uses the wall's choice (Video walls page)" }

commands:
  power_on:
    label: Power on
    # WAKEUP and SLEEP are discrete; KEYCODE_POWER would toggle.
    steps: [{ adb: input keyevent KEYCODE_WAKEUP }]
    sets: { power: "on" }
  power_off:
    label: Power off
    steps: [{ adb: input keyevent KEYCODE_SLEEP }]
    sets: { power: "off" }
  input:
    label: Select HDMI input
    params:
      input: { type: enum, label: Input, values: [hdmi1, hdmi2, hdmi3, hdmi4], labels: { hdmi1: HDMI 1, hdmi2: HDMI 2, hdmi3: HDMI 3, hdmi4: HDMI 4 } }
    steps: [{ adb: "input keyevent KEYCODE_TV_INPUT_HDMI_{{input | digits}}" }]
    sets: { input: "{{input}}" }
  home:
    label: Home
    steps: [{ adb: input keyevent KEYCODE_HOME }]
  key:
    label: Remote button
    params:
      key:
        type: enum
        label: Button
        values: [HOME, BACK, MENU, DPAD_UP, DPAD_DOWN, DPAD_LEFT, DPAD_RIGHT, DPAD_CENTER, MEDIA_PLAY_PAUSE, MEDIA_REWIND, MEDIA_FAST_FORWARD, VOLUME_UP, VOLUME_DOWN, VOLUME_MUTE]
    steps: [{ adb: "input keyevent KEYCODE_{{key}}" }]
  volume_up:
    label: Volume up
    steps: [{ adb: input keyevent KEYCODE_VOLUME_UP }]
  volume_down:
    label: Volume down
    steps: [{ adb: input keyevent KEYCODE_VOLUME_DOWN }]
  mute:
    label: Mute
    steps: [{ adb: input keyevent KEYCODE_VOLUME_MUTE }]
  launch:
    label: Open an app
    params:
      app: { type: string, label: "App package, e.g. com.netflix.ninja (Netflix)" }
    steps: [{ adb: "monkey -p {{app}} -c android.intent.category.LAUNCHER 1" }]

state:
  power: { type: enum, values: ["on", "off"], label: Power }
  input: { type: string, label: Last input sent }
  app: { type: string, label: On screen }
  model: { type: string, label: Model }

polls:
  - every: 15
    # One round trip: power, the app in front, and the model.
    steps: [{ adb: "dumpsys power | grep -m1 mWakefulness= ; dumpsys window | grep -m1 mCurrentFocus ; echo model=$(getprop ro.product.model)" }]
    parse:
      - regex: 'mWakefulness=(\w+)'
        set: { power: "{{value | map:Awake=on,*=off}}" }
      - regex: 'mCurrentFocus=Window\{\S+ \S+ ([\w.]+)'
        set: { app: "{{value}}" }
      - regex: 'model=(\S+)'
        set: { model: "{{value}}" }

capabilities:
  power: { on: power_on, off: power_off, state: power }
  source: { select: input, param: input, state: input }

controls:
  - { type: toggle, label: Power, on: power_on, off: power_off, state: power }
  - { type: select, label: Input, command: input, param: input }
  - { type: status, label: On screen, state: app }
  - type: dpad
    label: Remote
    command: key
    param: key
    keys: { up: DPAD_UP, down: DPAD_DOWN, left: DPAD_LEFT, right: DPAD_RIGHT, ok: DPAD_CENTER, back: BACK, menu: MENU, exit: HOME }
  - { type: button, label: Vol −, command: volume_down }
  - { type: button, label: Vol +, command: volume_up }
  - { type: button, label: Mute, command: mute }

simulator:
  state: { power: "off" }
