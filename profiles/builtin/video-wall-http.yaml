id: video-wall-http
name: Video wall controller (HTTP placeholder)
category: video-wall
description: >
  Placeholder for the video wall control API until its schema is final.
  Duplicate it and edit the recall command's path and body to match the real
  API. No code changes are needed.

transport:
  type: http
  port: 80

settings:
  - { key: host, label: IP address, type: string, required: true }
  - { key: port, label: Port, type: integer, default: 80 }
  - key: presets
    label: Layout presets
    type: list
    default: []
    fields:
      - { key: id, label: Preset id, type: string, required: true }
      - { key: name, label: Name, type: string, required: true }

commands:
  recall_preset:
    label: Recall layout
    params:
      preset: { type: string, label: Preset, optionsFrom: settings.presets }
    steps:
      - http: { method: POST, path: "/presets/{{preset}}/recall" }
    sets: { preset: "{{preset}}" }

state:
  preset: { type: string, label: Active layout }

capabilities:
  layoutPresets: { recall: recall_preset, param: preset, optionsFrom: settings.presets }

controls:
  - { type: presets, label: Layouts, command: recall_preset, param: preset, state: preset }
